<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-label="Thinking tree: AI workflow nodes">
  <!-- Same visual language as ComfyUI's mark: black squircle, single white
       glyph. The glyph is a node graph — two member cards fan into one
       outlined hub card, which is what this plugin's canvas does. -->
  <path d="M0 184.335C0 119.812 0 87.5502 12.5571 62.9055C23.6026 41.2274 41.2274 23.6026 62.9055 12.5571C87.5502 0 119.812 0 184.335 0H335.665C400.188 0 432.45 0 457.094 12.5571C478.773 23.6026 496.397 41.2274 507.443 62.9055C520 87.5502 520 119.812 520 184.335V335.665C520 400.188 520 432.45 507.443 457.094C496.397 478.773 478.773 496.397 457.094 507.443C432.45 520 400.188 520 335.665 520H184.335C119.812 520 87.5502 520 62.9055 507.443C41.2274 496.397 23.6026 478.773 12.5571 457.094C0 432.45 0 400.188 0 335.665V184.335Z" fill="#000000"/>

  <!-- wires: rounded elbows from each member card into the hub -->
  <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 178H236Q262 178 262 204V240"/>
    <path d="M140 342H236Q262 342 262 316V280"/>
  </g>

  <!-- member cards -->
  <g fill="#FFFFFF">
    <rect x="54" y="134" width="90" height="88" rx="24"/>
    <rect x="54" y="298" width="90" height="88" rx="24"/>
  </g>

  <!-- hub card: outlined, so one node reads as the shared one -->
  <rect x="262" y="152" width="204" height="216" rx="34" fill="#000000" stroke="#FFFFFF" stroke-width="30"/>
</svg>